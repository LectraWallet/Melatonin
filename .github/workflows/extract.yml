name: "Melatonin: extract source"

on:
  push:
    paths:
      - 'melatonin-source.zip'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          unzip -q melatonin-source.zip
          # Copy (merge) instead of move so the existing .github dir doesn't collide
          cp -a melatonin/. .
          rm -rf melatonin
          rm melatonin-source.zip
          # Don't push the build workflow via this token (GITHUB_TOKEN can't
          # create workflow files). main.yml is uploaded separately.
          rm -f .github/workflows/main.yml
          ls
      - name: Commit extracted source
        run: |
          git config user.name "Melatonin"
          git config user.email "melatonin@local"
          git add -A
          git commit -m "Melatonin source" || echo "nothing to commit"
          git push
